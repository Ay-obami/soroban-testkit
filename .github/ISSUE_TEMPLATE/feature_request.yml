name: Feature request
description: Propose a new module, generator, assertion, or CLI capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check `BUILD_SPEC.md` §3 (Scope boundaries) first. Proposals for
        mainnet/testnet forking, deployment tooling, frontend/JS testing,
        a test runner, or network-dependent features will be declined.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What testing gap does this fill?
    validations:
      required: true
  - type: input
    id: paths
    attributes:
      label: Affected file paths
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior / proposed public API
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: How to test locally
    validations:
      required: true
